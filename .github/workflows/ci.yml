name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Throwaway database for the API's tenant-isolation tests (never a Supabase project).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_parking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_parking_test
      # Public, non-secret build-time values so app builds can be verified.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      EXPO_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build
      # Fail if the tenancy suite was skipped (e.g. TEST_DATABASE_URL lost): it is a P1 gate.
      - run: pnpm --filter api exec vitest run src/tenancy.test.ts --reporter=verbose | tee tenancy.log && ! grep -q "skipped" tenancy.log
